---
name: PR Check
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  merge_group:
  workflow_dispatch:
    inputs:
      authoringSource:
        description: 'Where to obtain the Avm.Authoring PowerShell module.'
        required: false
        type: choice
        options:
          - gallery
          - repo
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        required: false
        type: string
        default: ''

jobs:
  run-managed-workflow:
    uses: Azure/azure-verified-modules-tools/.github/workflows/terraform-module.yml@31824f07a277458ce24e74ae69a33fdb18803bdf
    name: run managed workflow
    with:
      authoringSource: ${{ inputs.authoringSource || 'gallery' }}
      authoringRef: ${{ inputs.authoringRef || '' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
